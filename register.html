<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; background:#f8f9fa; padding:30px; }
    .wrap { max-width:700px; margin:0 auto; }
    .top { background:#fff; padding:24px; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.06); margin-bottom:18px; }
    .item { background:#fff; padding:18px; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.05); margin:12px 0; }
    .btn { display:inline-block; margin-top:10px; padding:12px 18px; background:#2563eb; color:#fff; text-decoration:none; border-radius:10px; }
    .btn:hover { background:#1d4ed8; }
    .tag { display:inline-block; font-size:12px; padding:4px 10px; border-radius:999px; background:#eef2ff; margin-left:8px; }
    a.back { display:inline-block; margin-top:12px; color:#2563eb; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Current Volunteer Sign-Ups</h1>
      <p id="updated"></p>
      <a class="back" href="/index.html">← Back</a>
    </div>

    <div id="list"></div>
  </div>

  <script>
    async function loadLinks() {
      const res = await fetch('/links.json', { cache: 'no-store' });
      const data = await res.json();

      document.getElementById('updated').textContent =
        "Updated: " + (data.updated || "—");

      const list = document.getElementById('list');
      list.innerHTML = "";

      (data.links || []).forEach(link => {
        const div = document.createElement('div');
        div.className = "item";
        div.innerHTML = `
          <h3>${link.title} ${link.badge ? `<span class="tag">${link.badge}</span>` : ""}</h3>
          <p>${link.description || ""}</p>
          <a class="btn" href="${link.url}" target="_blank" rel="noopener">Sign up</a>
        `;
        list.appendChild(div);
      });
    }
    loadLinks();
  </script>
</body>
</html>
